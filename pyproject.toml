[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BornSim"
version = "0.2.3"
description = "Vector Born-series scattering from continuous random dielectric media"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Martin Poinsinet de Sivry-Houle", email = "martin.poinsinet.de.sivry@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
keywords = ["born approximation", "light scattering", "random media", "tissue optics"]
dependencies = ["numpy>=1.24,<3", "TypedUnit==0.0.11", "matplotlib>=3.7,<4", "plotly>=6,<7"]

[project.optional-dependencies]
testing = ["pytest>=8,<10", "pytest-cov>=5,<8"]
test = ["BornSim[testing]"]
documentation = ["sphinx>=7,<10", "pydata-sphinx-theme>=0.16,<0.20", "sphinx-gallery>=0.19,<1", "sphinx-design>=0.6,<1"]
dev = ["ruff>=0.11,<1", "mypy>=1.11,<2", "build>=1.2,<2", "twine>=6,<7", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bornsim", "bornsim.*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["build", "dist", "htmlcov", "docs/build", "docs/source/auto_examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["bornsim/model.py", "bornsim/series.py", "bornsim/volume.py", "bornsim/green.py", "bornsim/ensemble.py", "bornsim/_validation.py", "bornsim/api.py", "bornsim/source.py", "bornsim/solver.py", "bornsim/results.py", "bornsim/units.py", "bornsim/media.py", "bornsim/geometry.py", "bornsim/grid.py", "bornsim/sampling.py", "bornsim/_archives.py", "bornsim/_result_plotting.py", "bornsim/_volume_plotting.py", "bornsim/angular_data.py", "bornsim/rotation.py", "bornsim/_result_validation.py", "bornsim/material.py", "bornsim/ensemble_sampling.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true
