# Simple workflow for deploying static content to GitHub Pages
name: Documentation

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]

  pull_request:
    branches:
      - master

concurrency:
  group: documentation-build-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ManyLinux_x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"

      - name: Install documentation dependencies
        run: python -m pip install ".[documentation]"

      - name: Build documentation
        env:
          MPLBACKEND: Agg
        run: make docs PYTHON=python

      - name: Verify Born equations and interactive volumes
        run: |
          python - <<'PYVERIFY'
          from pathlib import Path

          output = Path("docs/build/html")
          theory = (output / "theory.html").read_text()
          for equation in ("first-order-born", "born-iteration", "constitutive-model"):
              assert f'id="equation-{equation}"' in theory, equation
          assert "MathJax" in theory or "mathjax" in theory
          for correlation in ("gaussian", "exponential"):
              html = (output / "_static" / f"random-medium-{correlation}.html").read_text()
              assert "Plotly.newPlot" in html, correlation
              assert '"opacityscale":[[0,0],[1,1]]' in html, correlation
          PYVERIFY

      - name: Checkout documentation branch
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: documentation_page
          path: documentation-site

      - name: Publish versioned and latest documentation
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          DOCUMENTATION_BRANCH: documentation_page
        run: |
          set -Eeuo pipefail
          documentation_version="$(git describe --tags --abbrev=0)"
          documentation_output="${GITHUB_WORKSPACE}/docs/build/html"
          cd documentation-site
          mkdir -p docs
          rm -rf "docs/${documentation_version}" docs/latest
          cp -R "${documentation_output}" "docs/${documentation_version}"
          cp -R "${documentation_output}" docs/latest
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "docs/${documentation_version}" docs/latest .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update documentation for ${documentation_version} [skip ci]"
            git push origin "HEAD:${DOCUMENTATION_BRANCH}"
          fi

  prune_documentation_versions:
    needs: ManyLinux_x86_64
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    env:
      DOCUMENTATION_BRANCH: documentation_page
      VERSION_RETENTION_COUNT: 5

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ env.DOCUMENTATION_BRANCH }}

      - name: Retain only the newest documentation versions
        run: |
          set -Eeuo pipefail

          mapfile -t versions < <(
            find docs \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf "%f\n" \
              | grep -v "^latest$" \
              | sort -V -r
          )

          for version in "${versions[@]:${VERSION_RETENTION_COUNT}}"; do
            git rm -r -- "docs/${version}"
          done

      - name: Rebuild version switcher
        run: |
          set -Eeuo pipefail

          base_url="https://martinpdes.github.io/BornSim/docs"
          mapfile -t versions < <(
            find docs \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf "%f\n" \
              | grep -v "^latest$" \
              | sort -V -r
          )

          jq -n \
            --arg base_url "${base_url}" \
            --argjson versions "$(printf '%s\n' "${versions[@]}" | jq -R . | jq -s .)" \
            '[
              {
                name: "latest",
                version: "latest",
                url: ($base_url + "/latest")
              }
            ] + [
              $versions[] | {
                name: .,
                version: .,
                url: ($base_url + "/" + .)
              }
            ]' > version_switcher.json

          jq . version_switcher.json

      - name: Commit pruned documentation
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version_switcher.json

          if git diff --cached --quiet; then
            echo "Documentation already satisfies the retention policy."
            exit 0
          fi

          git commit -m "Retain the newest ${VERSION_RETENTION_COUNT} documentation versions [skip ci]"
          git push origin "HEAD:${DOCUMENTATION_BRANCH}"
