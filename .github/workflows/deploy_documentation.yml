name: Documentation
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - master
permissions:
  contents: read
jobs:
  documentation:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@6a294d5543d0b6ab20ca463234998c8d71fbaba3
    with:
      python-version: '3.11'
      package-name: BornSim
      apt-package: xvfb
      deploy-pages: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      debug: true
