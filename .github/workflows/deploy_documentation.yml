# Build and publish BornSim documentation.
name: Documentation

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["master"]

concurrency:
  group: documentation-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  documentation:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_documentation.yml@v11
    with:
      python-version: "3.11"
      package-name: "BornSim"
      apt-package: "xvfb"
      deploy-pages: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
