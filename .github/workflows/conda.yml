name: Verify Conda package

on:
  workflow_dispatch:
    inputs:
      python-versions:
        description: JSON list of Python versions to verify
        type: string
        default: '["3.11", "3.12", "3.13"]'
      os-list:
        description: JSON list of runner operating systems to verify
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  conda:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-list) }}
        python: ${{ fromJSON(inputs.python-versions) }}
    uses: MartinPdeS/MPSActions/.github/workflows/build_conda_package.yml@v5
    with:
      os: ${{ matrix.os }}
      python_version: ${{ matrix.python }}
      package_name: bornsim
      recipe_path: conda.recipe
      test_import: bornsim
      # Invoke the test prefix directly: the shared workflow's login shell
      # can reactivate base while conda run prepares the test environment.
      test_command: >-
        if [ \"$RUNNER_OS\" = Windows ]; then
          \"$RUNNER_TEMP/conda-package-test/python.exe\" -c 'import bornsim; print(bornsim.__version__)';
        else
          \"$RUNNER_TEMP/conda-package-test/bin/python\" -c 'import bornsim; print(bornsim.__version__)';
        fi
