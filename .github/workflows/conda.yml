name: Verify Conda package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conda:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    uses: MartinPdeS/MPSActions/.github/workflows/build_conda_package.yml@v5
    with:
      os: ${{ matrix.os }}
      python_version: ${{ matrix.python }}
      package_name: bornsim
      recipe_path: conda.recipe
      test_import: bornsim
