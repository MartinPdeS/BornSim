name: Wheel smoke test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python and build tools
        uses: MartinPdeS/MPSActions/actions/setup-python@a01969bc5af90666281f9d37acffdf6a4629763a
        with:
          python-version: "3.11"
          install-command: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python tools/check_wheel.py dist/*.whl
