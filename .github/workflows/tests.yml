name: Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Python and CI dependencies
        uses: MartinPdeS/MPSActions/actions/setup-python@0f5927acf88b25b5d253421e508387897096a2cc
        with:
          python-version: ${{ matrix.python }}
          install-command: >-
            python -m pip install --upgrade pip && python -m pip install -e ".[testing]"
      - run: python -m pytest --config-file=pytest.ini --cov-report=xml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
