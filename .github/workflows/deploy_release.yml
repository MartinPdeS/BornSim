name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_release.yml@v9
    with:
      pypi_package_type: pure
      pypi_python_version: "3.11"
      pypi_test_import: bornsim
      conda_python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      conda_os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      conda_package_name: bornsim
      conda_recipe_path: conda.recipe
      conda_test_import: bornsim
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
