name: Publish release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  pypi:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_pure_package_to_PyPi.yml@v2
    with:
      python-version: "3.11"
      test-command: python -c 'import bornsim'
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  conda:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@v3
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: bornsim
      recipe_path: conda.recipe
      # The shared workflow creates this prefix before verification. Avoid
      # `conda run ... python` resolving to the build environment's interpreter.
      test_command: >-
        if [ -f \"${RUNNER_TEMP}/conda-package-test/python.exe\" ]; then
          \"${RUNNER_TEMP}/conda-package-test/python.exe\" -c 'import bornsim';
        else
          \"${RUNNER_TEMP}/conda-package-test/bin/python\" -c 'import bornsim';
        fi
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
