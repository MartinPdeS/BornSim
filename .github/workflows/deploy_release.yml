name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_pure_package_to_PyPi.yml@v7
    with:
      python-version: "3.11"
      test_import: bornsim
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

  conda:
    uses: MartinPdeS/MPSActions/.github/workflows/publish_compiled_package_to_anaconda.yml@v7
    with:
      python_versions: '["3.11", "3.12", "3.13", "3.14"]'
      os_list: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      package_name: bornsim
      recipe_path: conda.recipe
      test_import: bornsim
    secrets:
      ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
